<!DOCTYPE html>
<html>
<head>
    <title>Elden - Business Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Business Settings</h1>
    <p>Manage your business information.</p>

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Business Name</label>
        <input
            type="text"
            name="business_name"
            value="{{ settings.business_name }}"
            required
        >

        <label>Phone Number</label>
        <input
            type="text"
            name="phone"
            value="{{ settings.phone or '' }}"
        >

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            value="{{ settings.email or '' }}"
        >

        <label>Business Address</label>
        <textarea name="address">{{ settings.address or '' }}</textarea>

        <label>Currency</label>
        <select name="currency">
            <option value="NGN" {% if settings.currency == 'NGN' %}selected{% endif %}>Naira (NGN)</option>
            <option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>US Dollar (USD)</option>
            <option value="GBP" {% if settings.currency == 'GBP' %}selected{% endif %}>British Pound (GBP)</option>
            <option value="EUR" {% if settings.currency == 'EUR' %}selected{% endif %}>Euro (EUR)</option>
        </select>

        <button type="submit">Save Settings</button>

    </form>

    <p><a href="{{ url_for('home') }}">Back to Dashboard</a></p>

</div>

</body>
</html>
